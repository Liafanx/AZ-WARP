name: ShellCheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Run ShellCheck
        run: |
          # SC2034/SC2120: переменные и функции общие для модулей, подключаемых через source
          shellcheck -S warning -e SC2034,SC2120 *.sh lib/*.sh menus/*.sh web/*.sh
